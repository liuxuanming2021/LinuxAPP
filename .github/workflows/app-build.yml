name: Build Nalxer App

# 手动触发，或者 app/mobile、app/mobile-ios12、本工作流文件有改动时自动跑
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/mobile/**'
      - 'app/mobile-ios12/**'
      - 'app/mobile-ios-native/**'
      - '.github/workflows/app-build.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装前端依赖
        working-directory: app/mobile
        run: npm install --no-audit --no-fund

      - name: 同步 web 资源到安卓工程
        working-directory: app/mobile
        run: npx cap copy android

      - name: Gradle wrapper 走官方地址
        working-directory: app/mobile/android
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: 构建 APK
        working-directory: app/mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 收集产物
        run: |
          mkdir -p out
          cp app/mobile/android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Nalxer-android-apk
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 ipa
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装前端依赖
        working-directory: app/mobile
        run: npm install --no-audit --no-fund

      - name: 同步 web 资源到 iOS 工程
        working-directory: app/mobile
        run: npx cap copy ios

      - name: 装 CocoaPods 依赖
        working-directory: app/mobile/ios/App
        run: pod install --repo-update

      - name: 编译归档（未签名）
        working-directory: app/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打成未签名 ipa
        run: |
          APP="app/mobile/ios/App/build/Build/Products/Release-iphoneos/App.app"
          ls -la "$(dirname "$APP")" || true
          if [ -d "$APP" ]; then
            mkdir -p payload/Payload
            cp -R "$APP" payload/Payload/
            cd payload && zip -qry "$GITHUB_WORKSPACE/Nalxer-unsigned.ipa" Payload
            cd .. && unzip -l "$GITHUB_WORKSPACE/Nalxer-unsigned.ipa" | head -20
          else
            echo "没找到 App.app，构建失败"
            exit 1
          fi

      - name: 再出一份 ad-hoc 签名包（补 application-identifier，装不上时用它）
        run: |
          bash .github/scripts/adhoc-sign.sh "app/mobile-ios-native/build/Build/Products/Release-iphoneos/LinuxAPP.app" "$GITHUB_WORKSPACE/LinuxAPP-ios-native-adhoc.ipa"

      - name: 编译失败时把日志带出来
        if: failure()
        run: tail -n 200 app/mobile-ios-native/build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxAPP-ios-native-ipa
          path: |
            LinuxAPP-ios-native-unsigned.ipa
            LinuxAPP-ios-native-adhoc.ipa
          if-no-files-found: warn
